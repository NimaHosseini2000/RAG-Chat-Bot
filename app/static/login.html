<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — RAG Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent:#6366f1; --accent-glow:rgba(99,102,241,0.35); --err:#f87171; }
    [data-theme="night"] {
      --bg:#07071a; --orb1:rgba(79,46,220,0.35); --orb2:rgba(30,20,100,0.45);
      --glass:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.10); --shadow:0 24px 64px rgba(0,0,0,0.4);
      --text:#e8eaf6; --muted:#7b83a8; --input-bg:rgba(255,255,255,0.05); --input-border:rgba(255,255,255,0.12);
    }
    [data-theme="day"] {
      --bg:#dde4ff; --orb1:rgba(180,190,255,0.7); --orb2:rgba(220,180,255,0.5);
      --glass:rgba(255,255,255,0.55); --border:rgba(255,255,255,0.8); --shadow:0 24px 64px rgba(100,100,200,0.15);
      --text:#1a1a2e; --muted:#5a6080; --input-bg:rgba(255,255,255,0.6); --input-border:rgba(180,185,255,0.5);
    }
    html,body { height:100%; }
    body {
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      color:var(--text); display:flex; align-items:center; justify-content:center;
      min-height:100dvh; position:relative; overflow:hidden; transition:color .3s;
    }
    .bg { position:fixed; inset:0; background:var(--bg); z-index:-2; transition:background .3s; }
    .orb { position:absolute; border-radius:50%; filter:blur(80px); animation:fl 20s ease-in-out infinite; }
    .orb:nth-child(1) { width:55vw;height:55vw;max-width:650px;max-height:650px;top:-20%;left:-15%;background:var(--orb1); }
    .orb:nth-child(2) { width:45vw;height:45vw;max-width:550px;max-height:550px;bottom:-20%;right:-10%;background:var(--orb2);animation-delay:-9s; }
    @keyframes fl { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(3%,4%) scale(1.04)} }

    .card {
      background:var(--glass); backdrop-filter:blur(32px) saturate(180%);
      border:1px solid var(--border); border-radius:24px; padding:40px;
      width:400px; max-width:92vw; box-shadow:var(--shadow);
      animation:cardIn .3s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(16px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }

    .logo {
      width:52px;height:52px;border-radius:16px;margin:0 auto 20px;
      background:linear-gradient(135deg,#6366f1,#a78bfa);
      display:flex;align-items:center;justify-content:center;font-size:26px;
      box-shadow:0 0 24px var(--accent-glow);
    }
    h1 { font-size:22px;font-weight:700;text-align:center;margin-bottom:4px; }
    .sub { font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px; }

    .field { margin-bottom:16px; }
    .field label { display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px; }
    .field input {
      width:100%;background:var(--input-bg);border:1px solid var(--input-border);
      border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;
      padding:11px 14px;outline:none;transition:border-color .2s,box-shadow .2s;
    }
    .field input:focus { border-color:rgba(99,102,241,.6);box-shadow:0 0 0 3px rgba(99,102,241,.12); }
    .field input::placeholder { color:var(--muted); }

    #err-msg { font-size:13px;color:var(--err);min-height:18px;margin-bottom:12px;text-align:center; }

    .submit-btn {
      width:100%;padding:12px;border:none;border-radius:12px;
      background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;
      font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
      box-shadow:0 4px 20px var(--accent-glow);transition:opacity .15s,transform .1s;
    }
    .submit-btn:hover { opacity:.9; }
    .submit-btn:active { transform:scale(.97); }
    .submit-btn:disabled { opacity:.5;cursor:not-allowed; }

    .theme-toggle {
      position:fixed;top:20px;right:20px;width:40px;height:40px;
      background:var(--glass);border:1px solid var(--border);border-radius:10px;
      display:flex;align-items:center;justify-content:center;font-size:18px;
      cursor:pointer;backdrop-filter:blur(12px);transition:background .15s,transform .15s;
    }
    .theme-toggle:hover { transform:rotate(15deg); }

    .back-link {
      display:block;text-align:center;margin-top:20px;
      font-size:13px;color:var(--muted);text-decoration:none;transition:color .15s;
    }
    .back-link:hover { color:var(--text); }
  </style>
</head>
<body>
<div class="bg"><div class="orb"></div><div class="orb"></div></div>

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>

<div class="card">
  <div class="logo">🤖</div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to access your dashboard</p>

  <div class="field">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
  </div>

  <div id="err-msg"></div>

  <button class="submit-btn" id="login-btn" onclick="doLogin()">Sign In</button>
  <a class="back-link" href="/">← Back to Chatbot</a>
</div>

<script>
  const root = document.documentElement;
  const btn  = document.getElementById('theme-btn');
  function applyTheme(t) { root.setAttribute('data-theme',t); btn.textContent = t==='night'?'🌙':'☀️'; localStorage.setItem('theme',t); }
  function toggleTheme() { applyTheme(root.getAttribute('data-theme')==='night'?'day':'night'); }
  applyTheme(localStorage.getItem('theme')||'night');

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('err-msg');
    const loginBtn = document.getElementById('login-btn');
    if (!username || !password) { errEl.textContent = 'Please enter username and password.'; return; }
    errEl.textContent = '';
    loginBtn.disabled = true; loginBtn.textContent = 'Signing in…';
    try {
      const res  = await fetch('/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, password }),
        credentials: 'include',
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = data.role === 'superadmin' ? '/superadmin' : '/admin';
      } else {
        errEl.textContent = data.detail || 'Login failed.';
        loginBtn.disabled = false; loginBtn.textContent = 'Sign In';
      }
    } catch (e) {
      errEl.textContent = 'Network error. Please try again.';
      loginBtn.disabled = false; loginBtn.textContent = 'Sign In';
    }
  }

  document.getElementById('password').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
  document.getElementById('username').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('password').focus(); });
</script>
</body>
</html>
