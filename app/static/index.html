<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #6366f1; --accent-hover: #4f46e5;
      --accent-glow: rgba(99,102,241,0.35);
      --ok: #4ade80; --err: #f87171; --radius: 14px; --tr: 0.3s ease;
    }
    [data-theme="night"] {
      --bg: #07071a; --orb1: rgba(79,46,220,0.35); --orb2: rgba(30,20,100,0.45); --orb3: rgba(100,30,120,0.25);
      --glass: rgba(255,255,255,0.04); --glass2: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08); --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --text: #e8eaf6; --muted: #7b83a8;
      --user-bg: rgba(99,102,241,0.75); --user-border: rgba(99,102,241,0.4);
      --bot-bg: rgba(255,255,255,0.06); --bot-border: rgba(255,255,255,0.10);
      --input-bg: rgba(255,255,255,0.05); --input-border: rgba(255,255,255,0.12);
      --pill-bg: rgba(255,255,255,0.08); --pill-text: #8892b0;
      --scroll: rgba(255,255,255,0.15);
    }
    [data-theme="day"] {
      --bg: #dde4ff; --orb1: rgba(180,190,255,0.7); --orb2: rgba(220,180,255,0.5); --orb3: rgba(255,210,230,0.4);
      --glass: rgba(255,255,255,0.50); --glass2: rgba(255,255,255,0.65);
      --border: rgba(255,255,255,0.75); --shadow: 0 8px 32px rgba(100,100,200,0.12);
      --text: #1a1a2e; --muted: #5a6080;
      --user-bg: rgba(99,102,241,0.85); --user-border: rgba(99,102,241,0.3);
      --bot-bg: rgba(255,255,255,0.65); --bot-border: rgba(200,200,255,0.4);
      --input-bg: rgba(255,255,255,0.6); --input-border: rgba(180,185,255,0.5);
      --pill-bg: rgba(99,102,241,0.1); --pill-text: #5a5e90;
      --scroll: rgba(100,100,200,0.2);
    }

    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text); height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden; position: relative;
      transition: color var(--tr);
    }

    .bg-scene { position: fixed; inset: 0; background: var(--bg); z-index: -2; transition: background var(--tr); }
    .bg-orb { position: absolute; border-radius: 50%; filter: blur(80px); transition: all var(--tr); animation: orbFloat 20s ease-in-out infinite; }
    .bg-orb:nth-child(1) { width: 60vw; height: 60vw; max-width: 700px; max-height: 700px; top: -20%; left: -15%; background: var(--orb1); }
    .bg-orb:nth-child(2) { width: 50vw; height: 50vw; max-width: 600px; max-height: 600px; bottom: -20%; right: -10%; background: var(--orb2); animation-delay: -7s; }
    .bg-orb:nth-child(3) { width: 35vw; height: 35vw; max-width: 450px; max-height: 450px; top: 40%; left: 50%; background: var(--orb3); animation-delay: -13s; }
    @keyframes orbFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(3%,4%) scale(1.04); }
      66%      { transform: translate(-2%,3%) scale(0.97); }
    }

    header {
      display: flex; align-items: center; gap: 12px; padding: 14px 24px; flex-shrink: 0; z-index: 10;
      background: var(--glass2); backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--border); box-shadow: 0 1px 24px rgba(0,0,0,0.08);
      transition: background var(--tr), border-color var(--tr);
    }
    .logo {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .header-text h1 { font-size: 16px; font-weight: 600; }
    .header-text p  { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      background: var(--glass); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); cursor: pointer; font-size: 17px; flex-shrink: 0;
      transition: background .15s, transform .15s;
    }
    .icon-btn:hover { background: var(--glass2); transform: rotate(15deg); }
    .upload-btn {
      display: flex; align-items: center; gap: 7px; padding: 9px 16px;
      background: var(--glass); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 13px; font-family: inherit; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s;
    }
    .upload-btn:hover { background: var(--glass2); border-color: rgba(99,102,241,0.4); }

    #messages {
      flex: 1; overflow-y: auto; padding: 32px 24px;
      display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }

    #empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; color: var(--muted); text-align: center; padding: 40px;
    }
    .empty-icon {
      width: 72px; height: 72px; border-radius: 20px;
      background: var(--glass2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; box-shadow: 0 4px 24px rgba(99,102,241,0.15); margin-bottom: 4px;
    }
    #empty-state h2 { font-size: 20px; font-weight: 600; color: var(--text); }
    #empty-state p  { font-size: 14px; max-width: 300px; line-height: 1.65; }

    .msg {
      display: flex; gap: 10px; max-width: 78%;
      animation: msgIn .22s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; margin-top: 2px;
    }
    .msg.user .avatar { background: rgba(99,102,241,0.8); box-shadow: 0 2px 12px var(--accent-glow); }
    .msg.bot  .avatar { background: rgba(100,30,200,0.6); box-shadow: 0 2px 12px rgba(120,60,220,0.25); }
    .bubble {
      padding: 12px 16px; border-radius: var(--radius);
      font-size: 14px; line-height: 1.7; word-break: break-word; white-space: pre-wrap;
      backdrop-filter: blur(12px);
    }
    .msg.user .bubble {
      background: var(--user-bg); border: 1px solid var(--user-border);
      border-bottom-right-radius: 4px; color: #fff; box-shadow: 0 4px 20px var(--accent-glow);
    }
    .msg.bot .bubble {
      background: var(--bot-bg); border: 1px solid var(--bot-border);
      border-bottom-left-radius: 4px; color: var(--text); box-shadow: var(--shadow);
    }
    .sources { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .sources-label { font-size: 11px; color: var(--muted); font-weight: 500; }
    .pill { font-size: 11px; background: var(--pill-bg); border-radius: 20px; padding: 3px 10px; color: var(--pill-text); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid rgba(255,255,255,0.06); }

    .typing-bubble { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }
    .dot { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: bounce 1.1s infinite; }
    .dot:nth-child(2) { animation-delay: .18s; }
    .dot:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .6; } 30% { transform: translateY(-6px); opacity: 1; } }

    footer {
      flex-shrink: 0; padding: 16px 24px;
      background: var(--glass2); backdrop-filter: blur(24px) saturate(180%);
      border-top: 1px solid var(--border); transition: background var(--tr), border-color var(--tr);
    }
    .input-row { display: flex; gap: 10px; align-items: flex-end; max-width: 820px; margin: 0 auto; }
    .input-wrap {
      flex: 1; background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 14px; backdrop-filter: blur(12px); transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap:focus-within { border-color: rgba(99,102,241,0.6); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    textarea {
      width: 100%; background: transparent; border: none; border-radius: 14px;
      color: var(--text); font-family: inherit; font-size: 14px; padding: 12px 16px;
      resize: none; min-height: 48px; max-height: 150px; line-height: 1.5; outline: none;
    }
    textarea::placeholder { color: var(--muted); }
    .send-btn {
      width: 48px; height: 48px; border: none; border-radius: 12px; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 4px 16px var(--accent-glow); transition: opacity .15s, transform .1s, box-shadow .15s;
    }
    .send-btn:hover   { opacity: .9; box-shadow: 0 6px 24px var(--accent-glow); }
    .send-btn:active  { transform: scale(.93); }
    .send-btn:disabled { background: var(--glass2); box-shadow: none; opacity: .5; cursor: not-allowed; }

    /* ── Modals (shared) ─────────────────────────────────────────────────── */
    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px); z-index: 50; align-items: center; justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--glass2); backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid var(--border); border-radius: 20px; padding: 28px;
      width: 440px; max-width: 92vw; box-shadow: 0 24px 64px rgba(0,0,0,0.3);
      animation: modalIn .22s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal h2 { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    .form-input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 10px; color: var(--text); font-family: inherit; font-size: 14px;
      padding: 10px 14px; outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .form-input:focus { border-color: rgba(99,102,241,0.6); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
    .form-input::placeholder { color: var(--muted); }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .drop-zone {
      border: 2px dashed var(--border); border-radius: 12px; padding: 40px 20px;
      text-align: center; cursor: pointer; color: var(--muted); transition: border-color .2s, background .2s;
    }
    .drop-zone:hover, .drop-zone.over { border-color: var(--accent); background: rgba(99,102,241,0.07); }
    .drop-zone .dz-icon { font-size: 40px; margin-bottom: 12px; }
    .drop-zone .dz-main { font-size: 14px; color: var(--text); font-weight: 500; }
    .drop-zone .dz-sub  { font-size: 12px; margin-top: 5px; }
    .btn {
      padding: 9px 22px; border-radius: 10px; border: none;
      font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; transition: background .15s, opacity .15s;
    }
    .btn-ghost { background: var(--glass); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--glass2); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #a78bfa); color: #fff; box-shadow: 0 4px 16px var(--accent-glow); }
    .btn-primary:hover { opacity: .9; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    #upload-status { min-height: 20px; margin-top: 14px; font-size: 13px; text-align: center; }
    .ok  { color: var(--ok); }
    .err { color: var(--err); }

    /* Session start modal special */
    #session-modal .modal { width: 400px; }
    .required-star { color: #f87171; }
  </style>
</head>
<body>

<div class="bg-scene">
  <div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-orb"></div>
</div>

<!-- Session start modal (shown first) -->
<div class="overlay open" id="session-modal">
  <div class="modal">
    <h2>👋 خوش آمدید</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6;">
      لطفاً نام خود را وارد کنید تا بتوانید سوالات خود را بپرسید.
    </p>
    <div class="form-group">
      <label>نام <span class="required-star">*</span></label>
      <input class="form-input" id="s-name" placeholder="نام و نام خانوادگی" dir="rtl">
    </div>
    <div class="form-group">
      <label>شماره دانشجویی (اختیاری)</label>
      <input class="form-input" id="s-id" placeholder="مثال: 4001234567" dir="ltr">
    </div>
    <div id="session-err" style="font-size:13px;color:var(--err);min-height:18px;margin-bottom:8px;"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="start-btn" onclick="startSession()">شروع گفتگو</button>
    </div>
  </div>
</div>

<!-- Header -->
<header>
  <div class="logo">🤖</div>
  <div class="header-text">
    <h1>RAG Chatbot</h1>
    <p id="header-sub">Ask questions about your documents</p>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <button class="upload-btn" onclick="openUpload()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.41 17.41a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
      </svg>
      Upload Document
    </button>
    <button class="icon-btn" onclick="endSession()" title="End session" style="font-size:14px;">🚪</button>
  </div>
</header>

<!-- Messages -->
<div id="messages">
  <div id="empty-state">
    <div class="empty-icon">💬</div>
    <h2>سوال خود را بپرسید</h2>
    <p>ابتدا یک سند آپلود کنید، سپس سوالات خود را بپرسید.</p>
  </div>
</div>

<!-- Input bar -->
<footer>
  <div class="input-row">
    <div class="input-wrap">
      <textarea id="input" placeholder="سوال خود را بنویسید… (Enter برای ارسال، Shift+Enter برای خط جدید)" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</footer>

<!-- Upload modal -->
<div class="overlay" id="upload-overlay" onclick="overlayClick(event)">
  <div class="modal">
    <h2>📎 Upload Document</h2>
    <div class="drop-zone" id="drop-zone"
      onclick="document.getElementById('file-input').click()"
      ondragover="dragOver(event)" ondragleave="dragLeave()" ondrop="drop(event)">
      <div class="dz-icon">📄</div>
      <div class="dz-main" id="dz-label">Click to browse or drag & drop</div>
      <div class="dz-sub">PDF · DOCX · PNG · JPG · TIFF</div>
    </div>
    <input type="file" id="file-input" hidden accept=".pdf,.docx,.doc,.png,.jpg,.jpeg,.tiff,.bmp" onchange="filePicked(event)">
    <div id="upload-status"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeUpload()">Cancel</button>
      <button class="btn btn-primary" id="upload-btn" onclick="doUpload()" disabled>Upload</button>
    </div>
  </div>
</div>

<script>
  let sessionId = null;
  let pickedFile = null;

  // ── Theme ──────────────────────────────────────────────────────────────────
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme-btn');
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'night' ? '🌙' : '☀️';
    localStorage.setItem('theme', t);
  }
  function toggleTheme() { applyTheme(root.getAttribute('data-theme') === 'night' ? 'day' : 'night'); }
  applyTheme(localStorage.getItem('theme') || 'night');

  // ── Session ────────────────────────────────────────────────────────────────
  async function startSession() {
    const name = document.getElementById('s-name').value.trim();
    const sid  = document.getElementById('s-id').value.trim();
    const err  = document.getElementById('session-err');
    if (!name) { err.textContent = 'لطفاً نام خود را وارد کنید.'; return; }
    err.textContent = '';
    document.getElementById('start-btn').disabled = true;

    try {
      const res = await fetch('/session/start', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ student_name: name, student_id: sid }),
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.detail || 'خطا در شروع جلسه.'; document.getElementById('start-btn').disabled = false; return; }
      sessionId = data.session_id;
      document.getElementById('header-sub').textContent = `جلسه ${name}`;
      document.getElementById('session-modal').classList.remove('open');
    } catch (e) {
      err.textContent = 'خطای شبکه. دوباره تلاش کنید.';
      document.getElementById('start-btn').disabled = false;
    }
  }

  async function endSession() {
    if (!sessionId) { location.reload(); return; }
    await fetch('/session/end', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ session_id: sessionId }),
    }).catch(() => {});
    sessionId = null;
    location.reload();
  }

  // Save session on page unload
  window.addEventListener('beforeunload', () => {
    if (sessionId) {
      navigator.sendBeacon('/session/end', JSON.stringify({ session_id: sessionId }));
    }
  });

  // ── Upload modal ───────────────────────────────────────────────────────────
  function openUpload() { document.getElementById('upload-overlay').classList.add('open'); }
  function closeUpload() {
    pickedFile = null;
    document.getElementById('upload-overlay').classList.remove('open');
    document.getElementById('file-input').value = '';
    document.getElementById('dz-label').textContent = 'Click to browse or drag & drop';
    document.getElementById('upload-status').textContent = '';
    document.getElementById('upload-status').className = '';
    const btn = document.getElementById('upload-btn');
    btn.disabled = true; btn.textContent = 'Upload';
  }
  function overlayClick(e) { if (e.target === document.getElementById('upload-overlay')) closeUpload(); }
  function dragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('over'); }
  function dragLeave() { document.getElementById('drop-zone').classList.remove('over'); }
  function drop(e) { e.preventDefault(); dragLeave(); const f = e.dataTransfer.files[0]; if (f) setFile(f); }
  function filePicked(e) { const f = e.target.files[0]; if (f) setFile(f); }
  function setFile(f) {
    pickedFile = f;
    document.getElementById('dz-label').textContent = f.name;
    document.getElementById('upload-btn').disabled = false;
    document.getElementById('upload-status').textContent = '';
  }
  async function doUpload() {
    if (!pickedFile) return;
    const btn = document.getElementById('upload-btn');
    const status = document.getElementById('upload-status');
    btn.disabled = true; btn.textContent = 'Uploading…'; status.textContent = '';
    const form = new FormData();
    form.append('file', pickedFile);
    try {
      const res = await fetch('/ingest', { method: 'POST', body: form });
      const data = await res.json();
      if (res.ok) {
        status.className = 'ok';
        status.textContent = `✓ ${data.chunks_indexed} chunks indexed from "${data.source}"`;
        btn.textContent = 'Done ✓';
      } else { throw new Error(data.detail || 'Upload failed'); }
    } catch (err) {
      status.className = 'err'; status.textContent = `✗ ${err.message}`;
      btn.disabled = false; btn.textContent = 'Upload';
    }
  }

  // ── Chat ───────────────────────────────────────────────────────────────────
  function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 150) + 'px'; }
  function isRTL(text) { return /[؀-ۿ]/.test(text); }

  function appendMessage(role, text, sources = [], urls = []) {
    const empty = document.getElementById('empty-state');
    if (empty) empty.remove();
    const wrap = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = `msg ${role}`;
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = role === 'user' ? '👤' : '🤖';
    const bub = document.createElement('div');
    bub.className = 'bubble';
    if (isRTL(text)) bub.setAttribute('dir', 'rtl');
    bub.textContent = text;
    if (sources.length || urls.length) {
      const src = document.createElement('div');
      src.className = 'sources';
      src.innerHTML = '<span class="sources-label">منابع:</span>';
      sources.forEach(s => {
        const p = document.createElement('span');
        p.className = 'pill'; p.title = s;
        p.textContent = '📄 ' + s.split(/[\\/]/).pop(); src.appendChild(p);
      });
      urls.forEach(u => {
        const p = document.createElement('span');
        p.className = 'pill'; p.title = u;
        p.textContent = '🔗 ' + u; src.appendChild(p);
      });
      bub.appendChild(src);
    }
    row.appendChild(av); row.appendChild(bub);
    wrap.appendChild(row);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function showTyping() {
    const wrap = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg bot'; row.id = 'typing';
    row.innerHTML = `<div class="avatar">🤖</div><div class="bubble typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    wrap.appendChild(row); wrap.scrollTop = wrap.scrollHeight;
  }
  function hideTyping() { const el = document.getElementById('typing'); if (el) el.remove(); }

  async function sendMessage() {
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const query = input.value.trim();
    if (!query) return;
    input.value = ''; input.style.height = 'auto'; sendBtn.disabled = true;
    appendMessage('user', query);
    showTyping();
    try {
      const res = await fetch('/chat', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ query, top_k: 5, session_id: sessionId || '' }),
      });
      const data = await res.json();
      hideTyping();
      if (res.ok) appendMessage('bot', data.answer, data.sources, data.urls);
      else appendMessage('bot', '⚠️ ' + (data.detail || 'Something went wrong.'));
    } catch (err) {
      hideTyping(); appendMessage('bot', '⚠️ Network error: ' + err.message);
    } finally {
      sendBtn.disabled = false; input.focus();
    }
  }

  // Enter on session modal triggers start
  document.getElementById('s-name').addEventListener('keydown', e => { if (e.key === 'Enter') startSession(); });
  document.getElementById('s-id').addEventListener('keydown',  e => { if (e.key === 'Enter') startSession(); });
</script>
</body>
</html>
